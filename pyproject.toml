[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-fabric-framework"
version = "0.1.0"
description = "Spark-first Microsoft Fabric data framework."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.13,<3",
  "SQLAlchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=9,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
